[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "cyberspace-recon-simulator"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = ["networkx>=3.2,<4", "numpy>=1.26,<3", "pydantic>=2.6,<3", "PySide6>=6.6,<7", "pyqtgraph>=0.13.3,<1", "scapy>=2.5,<3"]
[project.optional-dependencies]
test = ["pytest>=8,<10", "hypothesis>=6,<7"]
[project.scripts]
cybersim = "cybersim.main:main"
[tool.setuptools.packages.find]
include = ["cybersim*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
